name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: App bauen
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UrlaubsCast-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UrlaubsCast-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UrlaubsCast 1.0.${{ github.run_number }}
          body: |
            📲 **[APK direkt herunterladen](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/UrlaubsCast-1.0.${{ github.run_number }}.apk)**

            **Installieren:** Link auf dem Handy/Tablet öffnen → heruntergeladene Datei antippen → „Installieren“ bzw. „Aktualisieren“. Beim ersten Mal „Unbekannte Apps installieren“ für Browser bzw. Mail-App erlauben.

            Änderung: ${{ github.event.head_commit.message || 'manuell gestartet' }}

            Immer die neueste Version: https://github.com/${{ github.repository }}/releases/latest
          files: out/*.apk
          make_latest: true
